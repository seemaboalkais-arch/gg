name: Final Build Fix
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and Move Files
        run: |
          unzip *.zip
          # هذا السطر يبحث عن ملف gradlew في أي مكان وينقله للمجلد الرئيسي
          FILEPATH=$(find . -name "gradlew" -print -quit)
          DIRPATH=$(dirname "$FILEPATH")
          shopt -s dotglob
          mv "$DIRPATH"/* . || true

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          # التأكد من وجود ملفات التشغيل حتى لو كانت ناقصة
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartKeyboard-Final
          path: "**/build/outputs/apk/debug/*.apk"
