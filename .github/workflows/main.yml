name: Build Sarmad Fix Final
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Structure and Modern Configuration
        run: |
          # 1. إنشاء مجلدات الكود
          mkdir -p app/src/main/java/com/sarmad/aitool
          mkdir -p app/src/main/res/layout
          
          # 2. نقل ملفاتك (تأكد من وجودها في GitHub بنفس الأسماء)
          cp MainActivity.java app/src/main/java/com/sarmad/aitool/ || true
          cp activity_main.xml app/src/main/res/layout/ || true
          
          # 3. استخدام تنسيق .kts الحديث الذي يطلبه Gradle 9
          echo 'rootProject.name = "SarmadTool"
          include(":app")' > settings.gradle.kts

          # 4. ملف بناء التطبيق بتنسيق Kotlin لضمان التوافق
          echo 'plugins {
              id("com.android.application") version "8.1.0"
              id("org.jetbrains.kotlin.android") version "1.8.10" apply false
          }
          android {
              compileSdk = 33
              namespace = "com.sarmad.aitool"
              defaultConfig {
                  applicationId = "com.sarmad.aitool"
                  minSdk = 21
                  targetSdk = 33
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          repositories { google(); mavenCentral() }' > app/build.gradle.kts

          # 5. إنشاء المانيفست
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Sarmad AI"><activity android:name="com.sarmad.aitool.MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

      - name: Build with Modern Gradle
        run: |
          # السماح لـ Gradle 9 ببناء المشروع بتنسيقه الخاص
          chmod +x gradlew || true
          gradle assembleDebug --stacktrace

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarmad-AI-App
          path: "**/build/outputs/apk/debug/*.apk"
