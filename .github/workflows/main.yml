name: Build Sarmad Keyboard
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Project
        run: |
          # فك ضغط الملف الجديد
          unzip Sarmad*.zip
          # البحث عن ملف gradlew في المجلدات الفرعية ونقل المحتويات للمسار الرئيسي
          FILEPATH=$(find . -name "gradlew" -print -quit)
          DIRPATH=$(dirname "$FILEPATH")
          shopt -s dotglob
          mv "$DIRPATH"/* . || true

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarmad-Keyboard-App
          path: "**/build/outputs/apk/debug/*.apk"
