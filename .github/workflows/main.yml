name: Build Sarmad Keyboard
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Project
        run: |
          unzip Sarmad*.zip
          FILEPATH=$(find . -name "gradlew" -print -quit)
          DIRPATH=$(dirname "$FILEPATH")
          shopt -s dotglob
          mv "$DIRPATH"/* . || true

      - name: Force Fix Repositories
        run: |
          # إعادة كتابة ملف settings.gradle لفرض استخدام مستودعات جوجل
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }" >> settings.gradle
          echo "rootProject.name = 'SarmadKeyboard'" >> settings.gradle

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarmad-Keyboard-Final
          path: "**/build/outputs/apk/debug/*.apk"
