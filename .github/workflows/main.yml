name: Final Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          # هذه الخطوات هي التي تبني التطبيق بدلاً منك
          mkdir -p app/src/main/java/com/sarmad/aitool
          mkdir -p app/src/main/res/layout
          cp MainActivity.java app/src/main/java/com/sarmad/aitool/
          cp activity_main.xml app/src/main/res/layout/
          echo 'include ":app"' > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:7.4.2' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          echo 'apply plugin: "com.android.application"
          android {
              compileSdk 33
              namespace "com.sarmad.aitool"
              defaultConfig { applicationId "com.sarmad.aitool"; minSdk 21; targetSdk 33 }
          }' > app/build.gradle
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.sarmad.aitool"><application android:label="Sarmad AI"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

      - name: Build
        run: |
          gradle wrapper --gradle-version 7.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Get APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarmad-App
          path: app/build/outputs/apk/debug/*.apk
